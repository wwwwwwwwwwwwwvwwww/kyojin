<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1117;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  canvas#net { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .card {
    position: relative;
    width: 480px; min-height: 320px;
    background: rgba(16, 19, 27, 0.88);
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 50px 40px; text-align: center;
    backdrop-filter: blur(24px);
    border: 1px solid rgba(168, 216, 234, 0.12);
    box-shadow: 0 0 60px rgba(168, 216, 234, 0.08);
    z-index: 1;
  }
  .checkmark { width: 64px; height: 64px; margin-bottom: 24px; opacity: 0; transform: scale(0.5); animation: popIn 0.4s ease forwards; }
  .checkmark-circle { width: 64px; height: 64px; background: rgba(168, 216, 234, 0.15); border: 2px solid rgba(168, 216, 234, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .checkmark-circle svg { width: 32px; height: 32px; }
  .checkmark-circle svg path { stroke: #a8d8ea; stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 0.4s ease 0.3s forwards; }
  @keyframes popIn { to { opacity: 1; transform: scale(1); } }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 8px; color: #a8d8ea; }
  .subtitle { font-size: 13px; color: rgba(168, 216, 234, 0.45); letter-spacing: 2px; text-transform: lowercase; }
  .divider { width: 70%; height: 1px; background: rgba(168, 216, 234, 0.1); margin: 20px 0; }
  .footer-text { margin-top: 28px; font-size: 12px; color: rgba(168, 216, 234, 0.3); letter-spacing: 1.5px; line-height: 1.8; }
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="card">
  <div class="checkmark">
    <div class="checkmark-circle">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M8 16 L14 22 L24 10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="title">VERIFIED</div>
  <div class="subtitle">Verified as @example</div>
  <div class="divider"></div>
  <div class="footer-text">Role granted. Close this tab<br>and return to Discord.</div>
</div>
<script>
const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
class Particle {
  constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 1.5 + 0.5; }
  update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > w) this.vx *= -1; if (this.y < 0 || this.y > h) this.vy *= -1; }
  draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168, 216, 234, 0.5)'; ctx.fill(); }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());
function animate() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => { p.update(); p.draw(); });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(168, 216, 234, ${(1 - dist / 150) * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
