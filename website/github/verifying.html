<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1117;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  canvas#net { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .card {
    position: relative;
    width: 480px; min-height: 320px;
    background: rgba(16, 19, 27, 0.88);
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 50px 40px; text-align: center;
    backdrop-filter: blur(24px);
    border: 1px solid rgba(168, 216, 234, 0.12);
    box-shadow: 0 0 60px rgba(168, 216, 234, 0.08);
    z-index: 1;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(168, 216, 234, 0.12);
    border-top-color: #a8d8ea;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 28px;
  }
  .spinner.done { animation: none; border: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 8px; color: #a8d8ea; }
  .subtitle { font-size: 13px; color: rgba(168, 216, 234, 0.45); letter-spacing: 2px; text-transform: lowercase; }
  .icon { font-size: 48px; margin-bottom: 20px; }
  .icon.success { color: #43b581; }
  .icon.error { color: #f04747; }
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <div class="title" id="title">VERIFYING</div>
  <div class="subtitle" id="subtitle">Contacting server.</div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');

if (!code) {
  showError('No authorization code found.');
} else {
  doVerify(code);
}

async function doVerify(code) {
  try {
    const res = await fetch('/api/verify?code=' + encodeURIComponent(code));
    const data = await res.json();
    if (data.success) {
      showSuccess(data.username || 'You');
    } else {
      showError(data.error || 'Verification failed.');
    }
  } catch (e) {
    showError('Could not contact server.');
  }
}

function showSuccess(username) {
  const spinner = document.getElementById('spinner');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  spinner.classList.add('done');
  spinner.innerHTML = '<div class="icon success">&#10003;</div>';
  title.textContent = 'VERIFIED';
  title.style.color = '#43b581';
  subtitle.textContent = 'Welcome, ' + username + '!';
}

function showError(msg) {
  const spinner = document.getElementById('spinner');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  spinner.classList.add('done');
  spinner.innerHTML = '<div class="icon error">&#10007;</div>';
  title.textContent = 'ERROR';
  title.style.color = '#f04747';
  subtitle.textContent = msg;
}

const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
let w, h, particles = [];
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
class Particle {
  constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 1.5 + 0.5; }
  update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > w) this.vx *= -1; if (this.y < 0 || this.y > h) this.vy *= -1; }
  draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168, 216, 234, 0.5)'; ctx.fill(); }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());
function animate() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => { p.update(); p.draw(); });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(168, 216, 234, ${(1 - dist / 150) * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
