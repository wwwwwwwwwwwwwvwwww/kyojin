<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jinn - Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1117;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  canvas#net { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  .content {
    position: relative; z-index: 1;
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 56px 24px 40px;
  }
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(10, 12, 18, 0.95);
    backdrop-filter: blur(22px);
    border-bottom: 1px solid rgba(168, 216, 234, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .nav-name { font-size: 15px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #ffffff; transition: transform .2s ease, letter-spacing .2s ease, color .2s ease; cursor: pointer; }
  .nav-name:hover { transform: scale(1.08); letter-spacing: 5px; color: #a8d8ea; }
  .nav-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .nav-link {
    font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.2); text-decoration: none; padding: 6px 4px;
    transition: all 0.3s ease; cursor: pointer;
    position: relative; display: inline-block;
  }
  .nav-link::after {
    content: ''; position: absolute; bottom: 0; left: 0;
    width: 100%; height: 1px; background: #a8d8ea;
    transform: scaleX(0); transition: transform 0.3s;
  }
  .nav-link:hover::after { transform: scaleX(1); }
  .nav-link:hover { color: #ffffff; font-size: 14px; letter-spacing: 3px; }
  .online-text { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: rgba(255, 255, 255, 0.15); }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .online-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #43b581; box-shadow: 0 0 8px rgba(67, 181, 129, 0.5);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(67, 181, 129, 0.5); }
    50% { transform: scale(1.4); box-shadow: 0 0 14px rgba(67, 181, 129, 0.7); }
  }
  .login-card {
    width: 400px;
    background: rgba(14, 17, 23, 0.95);
    border: 1px solid rgba(168, 216, 234, 0.1);
    border-radius: 12px;
    padding: 40px 32px;
    backdrop-filter: blur(30px);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
    animation: cardIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease 0.3s forwards;
    opacity: 0;
    transform: translateY(10px);
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .login-title {
    font-size: 18px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase; color: #ffffff; margin-bottom: 6px;
  }
  .login-subtitle {
    font-size: 11px; color: rgba(168, 216, 234, 0.4);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .form-group {
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.5s ease forwards;
  }
  .form-group:nth-child(1) { animation-delay: 0.5s; }
  .form-group:nth-child(2) { animation-delay: 0.6s; }
  .login-btn {
    opacity: 0;
    animation: fadeUp 0.5s ease 0.7s forwards;
    width: 100%;
    padding: 14px;
    background: rgba(168, 216, 234, 0.1);
    border: 1px solid rgba(168, 216, 234, 0.2);
    border-radius: 8px;
    color: #a8d8ea;
    font-size: 11px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
  }
  .form-label {
    display: block;
    font-size: 10px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(255, 255, 255, 0.3);
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(168, 216, 234, 0.04);
    border: 1px solid rgba(168, 216, 234, 0.1);
    border-radius: 8px;
    color: #ffffff;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: all 0.3s;
    caret-color: #a8d8ea;
  }
  .form-input:focus {
    border-color: rgba(168, 216, 234, 0.3);
    background: rgba(168, 216, 234, 0.06);
    box-shadow: 0 0 20px rgba(168, 216, 234, 0.05);
  }
  .form-input::placeholder {
    color: rgba(255, 255, 255, 0.15);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: rgba(168, 216, 234, 0.1);
    border: 1px solid rgba(168, 216, 234, 0.2);
    border-radius: 8px;
    color: #a8d8ea;
    font-size: 11px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
  }
  .login-btn:hover {
    background: rgba(168, 216, 234, 0.18);
    border-color: rgba(168, 216, 234, 0.35);
    box-shadow: 0 0 30px rgba(168, 216, 234, 0.1);
  }
  .login-btn:active {
    transform: scale(0.98);
  }
  .login-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(168, 216, 234, 0.15);
    margin-bottom: 16px;
    animation: iconPulse 3s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168, 216, 234, 0); }
    50% { box-shadow: 0 0 20px 4px rgba(168, 216, 234, 0.15); }
  }
  .login-error {
    display: none;
    background: rgba(231, 76, 60, 0.08);
    border: 1px solid rgba(231, 76, 60, 0.25);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 16px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: #e74c3c;
    text-align: center;
    animation: glitch 0.3s ease;
  }
  @keyframes glitch {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
</style>
</head>
<body>
<nav class="navbar">
  <div class="nav-left">
    <a href="/" style="text-decoration:none;display:flex;align-items:center;gap:12px;">
      <img class="nav-icon" src="icon.png" alt="">
      <span class="nav-name">JINN</span>
    </a>
  </div>
  <div class="nav-center">
    <a class="nav-link" href="/">Home</a>
  </div>
  <div class="nav-right">
    <div class="online-dot"></div>
    <span class="online-text">Online</span>
  </div>
</nav>
<canvas id="net"></canvas>
<div class="content">
  <div class="login-card" id="login-card">
    <div class="login-header">
      <img class="login-icon" src="icon.png" alt="">
      <div class="login-title">JINN</div>
      <div class="login-subtitle">Admin Panel</div>
    </div>
    <div class="login-error" id="error">Invalid credentials</div>
    <form onsubmit="login(event)" id="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" type="text" id="user_id" placeholder="Enter your username" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Access Key</label>
        <input class="form-input" type="text" id="key" placeholder="Enter access key" autocomplete="off" style="text-transform:uppercase">
      </div>
      <button class="login-btn" type="submit">Login</button>
    </form>
  </div>
</div>
<script>
// ===== SOUNDS =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const gain2 = audioCtx.createGain();
  osc.connect(gain);
  osc2.connect(gain2);
  gain.connect(audioCtx.destination);
  gain2.connect(audioCtx.destination);
  osc.frequency.value = 3500 + Math.random() * 500;
  osc.type = 'square';
  osc2.frequency.value = 100 + Math.random() * 50;
  osc2.type = 'sine';
  gain.gain.setValueAtTime(0.012, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
  gain2.gain.setValueAtTime(0.02, t);
  gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  osc.start(t);
  osc.stop(t + 0.015);
  osc2.start(t);
  osc2.stop(t + 0.02);
}
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key.length === 1 || e.key === 'Backspace') playClick();
  }
});

// ===== SESSION CHECK =====
fetch('/api/session', { credentials: 'include' }).then(r => r.json()).then(data => {
  if (data.authenticated) window.location.href = '/dashboard';
});

async function login(e) {
  e.preventDefault();
  const uid = document.getElementById('user_id').value;
  const key = document.getElementById('key').value;
  document.getElementById('error').style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ user_id: uid, key: key })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/dashboard';
    } else {
      document.getElementById('error').textContent = data.error || 'Invalid credentials';
      document.getElementById('error').style.display = 'block';
    }
  } catch (err) {
    document.getElementById('error').textContent = 'Could not connect to server';
    document.getElementById('error').style.display = 'block';
  }
}

const canvas = document.getElementById('net');
const ctx = canvas.getContext('2d');
let w, h, particles = [], mouse = { x: -9999, y: -9999 };
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
document.addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });
class Particle {
  constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 1.5 + 0.5; }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < 0 || this.x > w) this.vx *= -1;
    if (this.y < 0 || this.y > h) this.vy *= -1;
    const dx = mouse.x - this.x, dy = mouse.y - this.y, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) { const f = (200 - dist) / 200 * 0.02; this.vx -= dx * f * 0.01; this.vy -= dy * f * 0.01; }
  }
  draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168, 216, 234, 0.5)'; ctx.fill(); }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());
function animate() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => { p.update(); p.draw(); });
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = `rgba(168, 216, 234, ${(1 - dist / 150) * 0.3})`; ctx.lineWidth = 0.5; ctx.stroke(); }
    }
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
